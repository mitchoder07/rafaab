<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="goldLightDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Gold amulet disc -->
  <circle cx="40" cy="40" r="38" fill="url(#goldLight)"/>
  <circle cx="40" cy="40" r="37" fill="none" stroke="url(#goldLightDark)" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="33" fill="none" stroke="url(#goldLightDark)" stroke-width="0.8" opacity="0.5"/>
  <!-- Decorative dots -->
  <circle cx="40" cy="11" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="40" cy="69" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <!-- RAFAAB text -->
  <text x="40" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">RAFAAB</text>
  <!-- Locking bar -->
  <rect x="14" y="42" width="52" height="1.5" fill="#FFFFFF" opacity="0.7"/>
  <!-- Shopping trolley -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 47 L30 47 L32 56"/>
    <path d="M31 50 L48 50 L46 58 L33 58 Z" fill="#FFFFFF" fill-opacity="0.15"/>
  </g>
  <circle cx="35" cy="61" r="1.6" fill="#FFFFFF"/>
  <circle cx="44" cy="61" r="1.6" fill="#FFFFFF"/>
</svg>
